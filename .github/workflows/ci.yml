name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret
          AUTH_GOOGLE_ID: ci
          AUTH_GOOGLE_SECRET: ci
